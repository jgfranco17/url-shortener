---
name: CICD

"on":
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run setup
        uses: ./.github/actions/setup-workspace

      - name: Run unit tests
        id: unit-tests
        run: |
          uv run pytest -vv -m "unit" --cov=api \
            --cov-branch \
            --cov-fail-under=80 | tee unit-tests.log

  integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run setup
        uses: ./.github/actions/setup-workspace
        with:
          include-docker: true

      - name: Build image
        env:
          ENVIRONMENT: "local"
        run: |
          just build

      - name: Start container
        run: |
          docker compose up -d
          sleep 10

      - name: Run integration tests
        env:
          RUN_INTEGRATION_TESTS: "true"
        run: |
          uv run pytest -vv -m "not unit"

  publish:
    name: Publish Image
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    strategy:
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run setup
        uses: ./.github/actions/setup-workspace
        with:
          include-docker: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.CI_GITHUB_USER }}
          password: ${{ secrets.CI_GITHUB_TOKEN }}

      - name: Get image details
        id: image
        run: |
          VERSION=${{ github.sha }}
          IMAGE_NAME=ghcr.io/jgfranco17/url-shortener-api
          echo "name=$IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          file: Dockerfile
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
