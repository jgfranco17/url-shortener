---
name: CICD

"on":
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run setup
        uses: ./.github/actions/setup-workspace

      - name: Run unit tests
        id: unit-tests
        run: |
          just pytest -vv -m "unit" --cov=api \
            --cov-branch \
            --cov-fail-under=80 | tee unit-tests.log

  integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run setup
        uses: ./.github/actions/setup-workspace
        with:
          include-docker: true

      - name: Build image
        env:
          ENVIRONMENT: "local"
        run: |
          just build

      - name: Start container
        run: |
          docker compose up -d
          sleep 10

      - name: Run integration tests
        env:
          RUN_INTEGRATION_TESTS: "true"
        run: |
          just pytest -vv -m "not unit"
