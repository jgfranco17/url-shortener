services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/jgfranco17/url-shortener-api:${TAG:-latest}
    container_name: url-shortener-api
    restart: unless-stopped
    ports:
      - "8080:8080"

  redis:
    image: redis:latest
    container_name: redis-server
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass pass --save 60 1
    volumes:
      - redis_data:/data

volumes:
  redis_data:
    driver: local
