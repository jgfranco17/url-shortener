[project]
name = "url-shortener"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.8,<0.116",
    "uvicorn>=0.34.0,<0.35",
    "sqlalchemy>=2.0.38,<3",
    "asyncpg>=0.30.0,<0.31",
    "alembic>=1.14.1,<2",
    "pydantic-settings>=2.7.1,<3",
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.6.6,<10",
    "prometheus-client>=0.26.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "httpx>=0.28.1",
    "isort>=8.0.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "requests>=2.34.2",
    "ruff>=0.16.4",
]

[tool.uv]
package = false

[tool.black]
line-length = 90

[tool.isort]
profile = "black"
line_length = 90

[tool.ruff]
target-version = "py312"
line-length = 90
